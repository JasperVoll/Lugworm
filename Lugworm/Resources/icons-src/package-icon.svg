<!-- Food4Rhino package icon source (64 px native). DRAFT - not maintainer-approved.
     "Lugworm" -> "I AM" wordplay: the letters are single extruded layer toolpaths
     (round-cap strokes, navy outline under a light-to-dark blue gradient layer),
     drawn in the same design language as the ribbon icons (IamSlicer.svg palette),
     with the nozzle currently printing the M's last stroke. No font dependency -
     the letterforms are hand-drawn geometric skeletons.
     Rasterize with tools/make_package_icon.ps1. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="layer" x1="0" y1="20" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cde4ff"/>
      <stop offset="0.45" stop-color="#639ed3"/>
      <stop offset="1" stop-color="#28699f"/>
    </linearGradient>
    <linearGradient id="nozzleFill" x1="0" y1="3" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cde4ff"/>
      <stop offset="1" stop-color="#639ed3"/>
    </linearGradient>
    <!-- everything printed: the letter layers and the fresh layer from the nozzle -->
    <mask id="printed">
      <g stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 8.5 25 L 8.5 47"/>
        <path d="M 16.5 47 L 22.5 25 L 28.5 47"/>
        <path d="M 19.6 40.5 L 25.4 40.5"/>
        <path d="M 35.5 47 L 35.5 25 L 41 38 L 46.5 25 L 46.5 47"/>
        <path d="M 46.5 15 L 46.5 25"/>
      </g>
    </mask>
  </defs>

  <!-- letter layers: navy outline pass under, gradient layer pass over -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#12334f" stroke-width="9">
      <path d="M 8.5 25 L 8.5 47"/>
      <path d="M 16.5 47 L 22.5 25 L 28.5 47"/>
      <path d="M 19.6 40.5 L 25.4 40.5"/>
      <path d="M 35.5 47 L 35.5 25 L 41 38 L 46.5 25 L 46.5 47"/>
    </g>
    <g stroke="url(#layer)" stroke-width="6">
      <path d="M 8.5 25 L 8.5 47"/>
      <path d="M 16.5 47 L 22.5 25 L 28.5 47"/>
      <path d="M 19.6 40.5 L 25.4 40.5"/>
      <path d="M 35.5 47 L 35.5 25 L 41 38 L 46.5 25 L 46.5 47"/>
    </g>
  </g>

  <!-- fresh layer from the nozzle into the M's top-right vertex -->
  <path d="M 46.5 15 L 46.5 25" fill="none" stroke="#12334f" stroke-width="9" stroke-linecap="round"/>
  <path d="M 46.5 15 L 46.5 25" fill="none" stroke="url(#layer)" stroke-width="6" stroke-linecap="round"/>

  <!-- horizontal layer lines across every printed layer: the letters have been
       PRINTED, layer by layer (same slice-line language as IamSlicer.svg) -->
  <g mask="url(#printed)" stroke="#12334f" stroke-width="1.3" opacity="0.5">
    <line x1="2" y1="18.2" x2="62" y2="18.2"/>
    <line x1="2" y1="21.8" x2="62" y2="21.8"/>
    <line x1="2" y1="25.4" x2="62" y2="25.4"/>
    <line x1="2" y1="29.0" x2="62" y2="29.0"/>
    <line x1="2" y1="32.6" x2="62" y2="32.6"/>
    <line x1="2" y1="36.2" x2="62" y2="36.2"/>
    <line x1="2" y1="39.8" x2="62" y2="39.8"/>
    <line x1="2" y1="43.4" x2="62" y2="43.4"/>
  </g>

  <!-- nozzle, ribbon-icon style: gradient body, navy outline -->
  <path d="M 41 4 L 52 4 L 52 7.5 L 49.8 11.5 L 43.2 11.5 L 41 7.5 Z"
        fill="url(#nozzleFill)" stroke="#12334f" stroke-width="1.8" stroke-linejoin="round"/>
  <rect x="45" y="11.5" width="3" height="2.8" fill="#12334f" rx="0.8"/>

  <!-- print-bed baseline -->
  <line x1="6" y1="56" x2="58" y2="56" stroke="#12334f" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
</svg>
