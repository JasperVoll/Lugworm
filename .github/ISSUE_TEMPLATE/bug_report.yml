name: Bug report
description: Something behaves wrongly or crashes
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Three things make a bug report actionable: the version, the `info` output
        of the failing component, and a minimal `.gh` file that reproduces the problem.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: The version Rhino's Package Manager shows for Lugworm, or the file version in the .gha file's properties.
      placeholder: "0.1.0-beta"
    validations:
      required: true
  - type: input
    id: rhino
    attributes:
      label: Rhino version
      placeholder: "Rhino 8 SR15 (8.15.xxxxx), Windows 11"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Slicing (Slice, non-planar modes)
        - Placement, Print Bed
        - G-code generation, Save, Restart
        - Robot Definition, Robot Simulation
        - Analyze (Overhang, Print Stats)
        - Calibration (DoE, RSM, Desirability)
        - Duet machine control (Duet Console, Machine Files, Live View)
        - Installation, loading
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the steps, the expected result, and the actual result.
    validations:
      required: true
  - type: textarea
    id: info-output
    attributes:
      label: "`info` output and error text"
      description: Paste the `info` output of the failing component and the text of any red or orange balloon.
      render: text
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        Attach a minimal `.gh` file that shows the problem (zip the file first; GitHub rejects bare `.gh` files).
        Clear the Duet password input before attaching. Screenshots of the canvas are helpful.
  - type: checkboxes
    id: safety
    attributes:
      label: Machine involvement
      options:
        - label: The problem involved a real machine (Duet control or a robot arm)
        - label: The component reference and the Component Map have been checked