name: Question
description: A usage question that the documentation does not answer
title: "[q] "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the documentation first: [Component Map](https://jaspervoll.github.io/Lugworm/docs/getting-started/component-map/),
        [Components](https://jaspervoll.github.io/Lugworm/docs/components/), and [About](https://jaspervoll.github.io/Lugworm/docs/about/).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What is the goal, and at which point does the plugin behave differently from what is expected?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "0.1.0-beta"
  - type: textarea
    id: context
    attributes:
      label: Setup
      description: Machine, material, document units, and anything else that is relevant.