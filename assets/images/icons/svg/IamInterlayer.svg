<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="1.0909 1.0909 21.8182 21.8182">
  <title>Interlayer time: stacked beads with a clock</title>
  <defs>
    <linearGradient id="layers" gradientUnits="userSpaceOnUse" x1="4" y1="8" x2="18" y2="21">
      <stop offset="0" stop-color="#cde4ff"/>
      <stop offset="0.48" stop-color="#639ed3"/>
      <stop offset="1" stop-color="#28699f"/>
    </linearGradient>
    <linearGradient id="clock" gradientUnits="userSpaceOnUse" x1="14" y1="3" x2="20" y2="11">
      <stop offset="0" stop-color="#565656"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <polygon points="3.5,16.7 13,14.3 20,17.5 10.5,20.8" fill="url(#layers)" stroke="#12334f" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="3.5,12.7 13,10.3 20,13.5 10.5,16.8" fill="url(#layers)" stroke="#12334f" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="3.5,8.7 13,6.3 20,9.5 10.5,12.8" fill="url(#layers)" stroke="#12334f" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="17" cy="7" r="4.5" fill="url(#clock)" stroke="#000000" stroke-width="1"/>
  <line x1="17" y1="7" x2="17" y2="4.3" stroke="#eef6ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="17" y1="7" x2="19.2" y2="8.3" stroke="#478ec7" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="17" cy="7" r="0.65" fill="#cde4ff"/>
</svg>
